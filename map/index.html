<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>RideMate · 메인지도</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="phone">
    <div class="status-bar">
      <span>9:41</span>
      <span class="status-right">▮▮▮  ◉  80</span>
    </div>

    <section class="map-screen">
      <div class="top-ui">
        <div class="search-row">
          <button class="search-box" id="searchBtn" aria-label="목적지 검색">
            <span class="search-icon">⌕</span>
            <span>목적지를 검색해보세요.</span>
          </button>
          <button class="menu-btn" id="menuBtn" aria-label="메뉴">☰</button>
        </div>

        <div class="quick-actions">
          <button data-action="home"><span class="quick-icon">⌂</span><span>집</span></button>
          <button data-action="work"><span class="quick-icon">▥</span><span>회사</span></button>
          <button data-action="favorite"><span class="quick-icon">★</span><span>즐겨찾기</span></button>
        </div>
      </div>

      <div class="map">
        <div id="kakaoMap" class="map-bg" aria-label="Kakao 지도"></div>
        <div class="map-overlay">

          <div class="map-controls right">
            <button id="compassBtn" title="방향 초기화">➤</button>
            <button id="currentLocationBtn" class="current-location-btn" title="현재 위치" aria-label="현재 위치">
              <span class="location-target" aria-hidden="true">
                <span class="target-ring"></span>
                <span class="target-dot"></span>
              </span>
            </button>
          </div>

          <div class="zoom-controls">
            <button id="zoomIn">＋</button>
            <button id="zoomOut">－</button>
          </div>
        </div>
      </div>

      <nav class="bottom-nav">
        <button class="nav-item active" data-tab="map">
          <span>지도</span>
        </button>
        <button class="nav-item" data-tab="racing">
          <span>레이싱</span>
        </button>
        <button class="nav-item" data-tab="record">
          <span>기록계</span>
        </button>
      </nav>

      <div class="toast" id="toast"></div>
    </section>

    <div class="home-indicator"></div>
  </main>

  <script src="/shared.js"></script><script src="app.js"></script>
</body>
</html>
