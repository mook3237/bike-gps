<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>RideMate</title>
  <link rel="stylesheet" href="/styles.css?v=20261001-profile-iphone">
</head>
<body>
  <section id="profileScreen" aria-label="RideMate 프로필 선택">
    <main class="profile-shell">
      <section class="profile-hero" aria-label="환영 화면">
        <img src="assets/profile-hero.jpg" alt="">
      </section>

      <section class="profile-panel">
        <div class="profile-panel-head">
          <h1>프로필 선택</h1>
          <button class="profile-add-top" type="button" id="profileAddTop">
            <span>프로필 추가</span><b aria-hidden="true">＋</b>
          </button>
        </div>

        <p id="profileEmptyState" class="profile-empty hidden">등록된 프로필이 없습니다.</p>
        <div class="profile-grid" id="profileGrid"></div>

        <button class="profile-select-button" id="profileSelectButton" type="button" disabled>
          <span>선택하기</span>
          <span class="profile-select-arrow" aria-hidden="true">→</span>
        </button>

        <div class="profile-home-indicator" aria-hidden="true"></div>
      </section>
    </main>

    <section id="profileEditor" class="profile-dialog-backdrop hidden" role="dialog" aria-modal="true" aria-labelledby="profileEditorTitle">
      <form id="profileEditorForm" class="profile-dialog">
        <h2 id="profileEditorTitle">프로필 추가</h2>
        <label class="profile-name-field">프로필 이름
          <input id="profileNameInput" type="text" maxlength="30" autocomplete="off" required>
        </label>
        <fieldset class="profile-avatar-field">
          <legend>Avatar</legend>
          <div class="profile-photo-row">
            <span id="profilePhotoPreview" class="profile-photo-preview" aria-hidden="true"></span>
            <div class="profile-photo-actions">
              <button id="profilePhotoSelect" type="button">프로필 사진 선택</button>
              <button id="profilePhotoRemove" type="button">사진 제거</button>
            </div>
            <input id="profilePhotoInput" type="file" accept="image/*" hidden>
          </div>
          <div id="profileAvatarChoices" class="profile-avatar-choices"></div>
        </fieldset>
        <p id="profileEditorError" class="profile-editor-error" role="alert"></p>
        <div class="profile-dialog-actions">
          <button id="profileEditorCancel" type="button" class="profile-dialog-secondary">취소</button>
          <button type="submit" class="profile-dialog-primary">저장</button>
        </div>
        <button id="profileDeleteButton" type="button" class="profile-delete-button hidden">프로필 삭제</button>
      </form>
    </section>

    <section id="profileDeleteConfirm" class="profile-dialog-backdrop hidden" role="alertdialog" aria-modal="true" aria-labelledby="profileDeleteTitle">
      <div class="profile-dialog">
        <h2 id="profileDeleteTitle">프로필을 삭제할까요?</h2>
        <p>이 프로필을 삭제하면 이 프로필에 연결된 설정, 장소, 저장 경로, 라이딩 기록, 레이싱 기록도 함께 삭제됩니다.</p>
        <div class="profile-dialog-actions">
          <button id="profileDeleteCancel" type="button" class="profile-dialog-secondary">취소</button>
          <button id="profileDeleteConfirmButton" type="button" class="profile-delete-confirm-button">삭제</button>
        </div>
      </div>
    </section>
  </section>

  <main id="app" class="hidden">
    <div id="map" aria-label="RideMate 지도"></div>

    <div id="overlayRoot">
      <header id="mapHeader" class="top-ui">
        <button id="searchEntry" class="search-entry"><span>⌕</span><b>목적지 검색</b></button>
        <button id="menuBtn" class="icon-btn" aria-label="메뉴">☰</button>
      </header>

      <section id="mainMenu" class="main-menu-layer hidden" aria-hidden="true">
        <button id="mainMenuBackdrop" class="main-menu-backdrop" type="button" aria-label="메뉴 닫기"></button>
        <aside id="mainMenuDrawer" class="main-menu-drawer" role="dialog" aria-modal="true" aria-label="RideMate 메뉴">
          <div id="mainMenuContent" class="main-menu-content">
            <button id="mainMenuProfile" class="main-menu-profile" type="button" data-menu-profile-change>
              <span id="mainMenuProfileAvatar" class="main-menu-avatar" aria-hidden="true"></span>
              <span class="main-menu-profile-copy"><strong id="mainMenuProfileName"></strong><small>프로필 변경</small></span>
              <span class="main-menu-chevron" aria-hidden="true">›</span>
            </button>
            <div class="main-menu-divider"></div>
            <nav class="main-menu-primary" aria-label="주요 메뉴">
              <button type="button" data-menu-item="places"><strong>내 장소</strong> <small>집 · 회사 · 즐겨찾기</small></button>
              <button type="button" data-menu-item="racing-records"><strong>레이싱 기록</strong></button>
              <button type="button" data-menu-item="app-settings"><strong>앱 설정</strong></button>
            </nav>
            <div class="main-menu-divider"></div>
            <nav class="main-menu-support" aria-label="지원 메뉴">
              <button type="button" data-menu-item="notices">공지사항</button>
              <button type="button" data-menu-item="help">도움말</button>
              <button type="button" data-menu-item="app-info">앱 정보</button>
            </nav>
          </div>
          <button id="mainMenuClose" class="main-menu-close" type="button">닫기</button>
        </aside>
      </section>

      <section id="myPlacesScreen" class="my-places-screen hidden" aria-hidden="true">
        <header class="my-places-header">
          <button id="myPlacesBack" class="my-places-back" type="button" aria-label="뒤로">‹</button>
          <h1>내 장소</h1>
        </header>
        <main class="my-places-content">
          <section id="myPlaceHome" class="my-place-card"></section>
          <section id="myPlaceWork" class="my-place-card"></section>
          <section class="my-places-favorites" aria-labelledby="myPlacesFavoritesTitle">
            <div class="my-places-section-header"><h2 id="myPlacesFavoritesTitle">즐겨찾기</h2><button id="addFavoriteBtn" type="button">추가</button></div>
            <div id="myPlacesFavorites"></div>
          </section>
        </main>
        <div id="favoriteEditor" class="dialog-backdrop hidden">
          <form id="favoriteEditorForm" class="dialog">
            <h2>즐겨찾기 이름</h2>
            <label class="profile-name-field favorite-name-field"><span>이름</span><input id="favoriteNameInput" maxlength="40" autocomplete="off"></label>
            <p id="favoriteEditorError" class="profile-editor-error" aria-live="polite"></p>
            <div id="favoriteEditorActions" class="profile-editor-actions favorite-editor-actions"><button type="submit">저장</button><button id="favoriteEditorCancel" type="button">취소</button></div>
          </form>
        </div>
      </section>

      <section id="appSettingsScreen" class="app-settings-screen hidden" aria-hidden="true">
        <header class="app-settings-header">
          <button id="appSettingsBack" class="app-settings-back" type="button" aria-label="뒤로">‹</button>
          <h1>앱 설정</h1>
        </header>
        <main class="app-settings-content">
          <h2>일반</h2>
          <label class="app-setting-row"><span><strong>거리 단위</strong><small>거리와 속도 표시 단위</small></span><select data-setting="distanceUnit"><option value="km">km</option><option value="mi">mi</option></select></label>
          <label class="app-setting-row"><span><strong>화면 항상 켜기</strong><small>지원되는 기기에서 화면 꺼짐 방지</small></span><input type="checkbox" data-setting="keepScreenAwake"></label>
          <label class="app-setting-row"><span><strong>짧은 주행 저장</strong><small>저장 기준 확정 후 적용 예정</small></span><input type="checkbox" data-setting="saveShortRides"></label>
          <label class="app-setting-row"><span><strong>시계 형식</strong><small>도착 예정 시간 표시</small></span><select data-setting="clockFormat"><option value="device">기기 설정</option><option value="12h">12시간</option><option value="24h">24시간</option></select></label>
        </main>
      </section>

      <section id="searchPanel" class="panel hidden">
        <div class="search-head">
          <button id="searchBack" class="icon-btn">‹</button>
          <div class="search-box"><input id="searchInput" autocomplete="off" placeholder="목적지 검색"><button id="searchClear">×</button></div>
        </div>
        <div id="searchLanding">
          <div class="search-shortcuts" aria-label="저장 장소 바로가기">
            <button data-quick="home"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M3 10.8 12 3l9 7.8v9.7h-6v-6H9v6H3z"/></svg><span>집</span></button>
            <button data-quick="work"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M4 21V7h5V3h6v4h5v14h-6v-4h-4v4zm7-14h2V5h-2z"/></svg><span>회사</span></button>
            <button data-quick="favorite"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="m12 2.8 2.8 5.7 6.2.9-4.5 4.4 1.1 6.2-5.6-2.9L6.4 20l1.1-6.2L3 9.4l6.2-.9z"/></svg><span>즐겨찾기</span></button>
          </div>
          <div class="recent-head"><h3 id="searchLandingTitle">최근 검색</h3><button id="selectOnMapBtn" type="button">지도에서 선택</button></div>
          <div id="recentSearches"></div>
        </div>
        <div id="liveResults" class="live-results hidden"></div>
      </section>

      <div class="route-layout">
      <section id="routeEditor" class="route-editor hidden">
        <div id="routeSelectionFields" class="route-fields">
          <div class="route-point-row" data-route-point="0">
            <button class="route-point-drag" data-route-point-drag="0" aria-label="현재 위치 순서 변경">⠿</button>
            <button id="departureField" class="route-point-copy route-point-edit"><b>현재 위치</b></button>
          </div>
          <div id="waypointFields"></div>
          <div class="route-point-row" data-route-point="1">
            <button class="route-point-drag" data-route-point-drag="1" aria-label="목적지 순서 변경">⠿</button>
            <button id="destinationField" class="route-point-copy route-point-edit"><b>목적지</b></button>
            <div class="route-point-actions"><button id="addWaypointBtn" class="route-point-add" aria-label="경로 추가">+</button></div>
          </div>
        </div>
        <div id="routePointEditorFields" class="route-fields hidden"></div>
        <button id="swapBtn" class="swap-btn" aria-label="출발 도착 바꾸기">⇅</button>
      </section>

      <section id="routeCards" class="route-cards hidden"></section>
      <div class="route-selection-actions">
        <button id="startNavBtn" class="primary-floating hidden">안내 시작</button>
        <button id="cancelRoutePreviewBtn" class="route-preview-cancel hidden">취소</button>
      </div>
      </div>

      <div id="mapControls" class="map-controls">
        <div class="zoom-controls"><button id="zoomIn">＋</button><button id="zoomOut">－</button></div>
        <div class="right-controls"><button id="locateBtn" aria-label="현재 위치">⌾</button></div>
      </div>
      <button id="searchHereBtn" class="search-here-btn hidden">여기서 재검색</button>

      <section id="sheet" class="sheet hidden">
        <div id="sheetHandle" class="sheet-handle"><i></i></div>
        <div id="sheetContent"></div>
      </section>

      <div id="routePointEditorActions" class="route-point-editor-actions hidden">
        <button id="cancelRoutePointEditorBtn" class="secondary-btn">취소</button>
        <button id="confirmRoutePointEditorBtn" class="primary-btn">확인</button>
      </div>

      <section id="navOverlay" class="nav-overlay hidden">
        <div class="turn-card">
          <div id="turnIcon" class="turn-icon">↑</div>
          <div class="turn-copy"><b id="turnDistance">경로 안내</b><span id="turnText">경로를 따라 이동하세요</span><small id="nextTurnText">다음 안내를 준비 중입니다</small></div>
        </div>
        <div class="nav-tools">
          <button id="navSearchBtn" aria-label="검색">⌕</button>
          <button id="navLocateBtn" aria-label="현재 위치 추적">◎</button>
        </div>
        <div id="navRouteStatus" class="nav-route-status" aria-live="polite"></div>
        <div class="speed-pill"><b id="speedValue">0</b><small id="speedUnit">km/h</small></div>
        <div id="navHud" class="nav-hud">
          <button id="navRecalcBtn" class="nav-recalc-btn" aria-label="경로 재탐색">↻</button>
          <button id="navInfoToggle" class="nav-info-toggle">
            <span><small id="navPrimaryLabel">도착 예정</small><b id="navPrimaryValue">--:--</b></span>
            <span><small>남은 거리</small><b id="remainDistance">--km</b></span>
          </button>
          <button id="navMenuBtn" class="nav-menu-btn">≡</button>
        </div>
      </section>

      <section id="navMenu" class="modal-sheet hidden">
        <div class="modal-grab"></div>
        <h3>주행 메뉴</h3>
        <div class="menu-grid">
          <button data-nav-action="volume">🔊<span>안내 음량</span></button>
          <button data-nav-action="theme">☾<span>주야간</span></button>
          <button data-nav-action="recalc">↻<span>경로 재탐색</span></button>
          <button data-nav-action="pause">Ⅱ<span>일시정지</span></button>
          <button data-nav-action="add-route">＋<span>경로 추가</span></button>
          <button data-nav-action="alternate-route">≋<span>다른 경로 보기</span></button>
        </div>
        <button id="endNavBtn" class="danger-btn">안내 종료</button>
      </section>

      <section id="saveModal" class="dialog-backdrop hidden">
        <div class="dialog">
          <h2>주행을 종료했습니다</h2>
          <div class="ride-summary">
            <div><small>이동거리</small><b id="summaryDistance">0.0 km</b></div>
            <div><small>주행시간</small><b id="summaryDuration">0분</b></div>
            <div><small>평균속도</small><b id="summaryAverageSpeed">0.0 km/h</b></div>
            <div><small>최고속도</small><b id="summaryMaxSpeed">0.0 km/h</b></div>
          </div>
          <p>이번 주행 기록을 저장할까요?</p>
          <button id="saveRideBtn" class="primary-btn">저장하기</button>
          <button id="discardRideBtn" class="secondary-btn">저장하지 않기</button>
        </div>
      </section>

      <div id="toast" class="toast hidden"></div>

      <nav id="bottomNav" class="bottom-nav">
        <button class="active">지도</button><button>레이싱</button><button>기록계</button>
      </nav>
    </div>
  </main>
  <script src="/settings-foundation.js?v=20261004-settings"></script>
  <script src="/profile-system.js?v=20261004-settings"></script>
  <script src="/app.js?v=20260930-profile"></script>
</body>
</html>
