<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>자전거 GPS 트래커</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#121212">
    <meta name="description" content="실시간 자전거 속도 기록 및 경로 추적 웹앱">
</head>
<body>
    <div class="container">
        <!-- 1️⃣ 속도계 화면 탭 -->
        <div class="tab-content active" id="speed-tab">
            <div class="main-stats" id="main-stats-long-press">
                <div class="top-dashboard-bar">
                    <div id="elapsed-time" class="top-time-display">00:00:00</div>
                    <div class="mini-btn-group" style="display: flex; gap: 8px;">
                        <button id="startBtn" class="btn btn-primary" style="padding: 8px 14px; min-height: 36px; border-radius: 50%;">▶</button>
                        <button id="stopBtn" class="btn btn-danger" style="padding: 8px 14px; min-height: 36px; border-radius: 50%;" disabled>⏹</button>
                    </div>
                </div>

                <div class="speedometer-card">
                    <div class="stat-item">
                        <label>현재 속도</label>
                        <p id="current-speed" class="big-text">0.0</p>
                        <p class="speed-unit">km/h</p>
                    </div>
                    <div class="stat-item" style="margin-top: 5px;">
                        <p id="current-distance" class="sub-speedometer-stat">0.00<span>km</span></p>
                    </div>
                </div>
            </div>

            <div class="button-group">
                <button id="saveBtn" class="btn btn-success btn-large" disabled>🔴 기록 저장하기</button>
            </div>

            <div class="info-grid">
                <div class="info-item">
                    <label>평균 속도</label>
                    <p id="avg-speed">0.0 <span style="font-size: 12px; color: var(--text-light);">km/h</span></p>
                </div>
                <div class="info-item">
                    <label>최고 속도</label>
                    <p id="max-speed">0.0 <span style="font-size: 12px; color: var(--text-light);">km/h</span></p>
                </div>
                <div class="info-item">
                    <label>목표 설정 속도</label>
                    <input type="number" id="target-speed" class="input-field" placeholder="목표 km/h" min="0" step="1">
                </div>
                <div class="info-item">
                    <label>남은 거리</label>
                    <p id="remaining-distance">0.00 <span style="font-size: 12px; color: var(--text-light);">km</span></p>
                </div>
            </div>

            <div class="gps-info">
                <div class="info-item">
                    <label>위도</label>
                    <p id="latitude">-</p>
                </div>
                <div class="info-item">
                    <label>경도</label>
                    <p id="longitude">-</p>
                </div>
                <div class="info-item">
                    <label>정확도 / 상태</label>
                    <p id="accuracy">-</p>
                </div>
            </div>
            <div style="text-align: center; font-size: 12px; color: var(--text-light); margin-bottom: 10px;" id="gps-status">준비 중...</div>
        </div>

        <!-- 2️⃣ 지도 화면 탭 -->
        <div class="tab-content" id="map-tab">
            <div id="map" class="map-container" style="width: 100%; height: 100%; position: absolute;"></div>
        </div>

        <!-- 하단 고정 탭 네비게이션 -->
        <div class="tabs">
            <button class="tab-btn active" data-tab="speed">
                <span>⏱️</span>
                <span>속도계</span>
            </button>
            <button class="tab-btn" data-tab="map">
                <span>🗺️</span>
                <span>지도</span>
            </button>
        </div>
    </div>

    <!-- 설정 메뉴 모달 -->
    <div class="settings-menu" id="settings-menu">
        <div class="settings-title">메인 정보 선택</div>
        <div class="settings-grid">
            <button class="settings-btn" data-metric="time">시간</button>
            <button class="settings-btn" data-metric="speed">현재 속도</button>
            <button class="settings-btn" data-metric="avg-speed">평균 속도</button>
            <button class="settings-btn" data-metric="max-speed">최고 속도</button>
            <button class="settings-btn" data-metric="distance">거리</button>
            <button class="settings-btn" data-metric="altitude">고도</button>
        </div>
    </div>

    <!-- 필수 라이브러리 및 스크립트 정석 로드 -->
    <script src="config.js"></script>
    <!-- 카카오맵 SDK를 동기식으로 안전하게 불러오기 -->
    <script>
        const apiKey = (typeof CONFIG !== 'undefined' && CONFIG.KAKAO_MAP_API_KEY) ? CONFIG.KAKAO_MAP_API_KEY : '${{ secrets.KAKAO_MAP_API_KEY }}';
        document.write(`<script src="//dapi.kakao.com/v2/maps/sdk.js?appkey=${apiKey}&autoload=false"><\/script>`);
    </script>
    <script src="gps.js"></script>
    <script src="map.js"></script>
    <script src="app.js"></script>

    <!-- 탭 전환 이벤트 보장 스크립트 -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const tabButtons = document.querySelectorAll('.tab-btn');
            tabButtons.forEach(btn => {
                btn.addEventListener('click', () => {
                    const targetTab = btn.getAttribute('data-tab');
                    
                    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
                    document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
                    
                    btn.classList.add('active');
                    const targetContent = document.getElementById(targetTab + '-tab');
                    if (targetContent) targetContent.classList.add('active');

                    if (targetTab === 'map' && window.mapManager && window.mapManager.map) {
                        setTimeout(() => {
                            window.mapManager.map.relayout();
                        }, 100);
                    }
                });
            });
        });
    </script>
</body>
</html>
