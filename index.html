<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>자전거 GPS 트래커</title>
    <link rel="stylesheet" href="styles.css?v=6">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#121212">
    
    <script>
        window.__KAKAO_API_KEY__ = '${{ secrets.KAKAO_MAP_API_KEY }}';
    </script>
</head>
<body>
    <div class="container">
        <!-- 1️⃣ 속도계 화면 탭 -->
        <div class="tab-content active" id="speed-tab">
            <div class="main-stats" id="main-stats-long-press">
                <div class="top-dashboard-bar">
                    <div id="elapsed-time" class="top-time-display">00:00:00</div>
                    <div class="mini-btn-group" style="display: flex; gap: 8px;">
                        <button id="startBtn" class="btn btn-primary" style="padding: 8px 14px; min-height: 36px; border-radius: 50%;">▶</button>
                        <button id="stopBtn" class="btn btn-danger" style="padding: 8px 14px; min-height: 36px; border-radius: 50%;" disabled>⏹</button>
                    </div>
                </div>

                <div class="speedometer-card">
                    <div class="stat-item">
                        <label>현재 속도</label>
                        <p id="current-speed" class="big-text">0.0</p>
                        <p class="speed-unit">km/h</p>
                    </div>
                    <div class="stat-item" style="margin-top: 5px;">
                        <p id="current-distance" class="sub-speedometer-stat">0.00<span>km</span></p>
                    </div>
                </div>
            </div>

            <div class="button-group">
                <button id="saveBtn" class="btn btn-success btn-large" disabled>🔴 기록 저장하기</button>
            </div>

            <div class="info-grid">
                <div class="info-item">
                    <label>평균 속도</label>
                    <p id="avg-speed">0.0 <span style="font-size: 12px; color: var(--text-light);">km/h</span></p>
                </div>
                <div class="info-item">
                    <label>최고 속도</label>
                    <p id="max-speed">0.0 <span style="font-size: 12px; color: var(--text-light);">km/h</span></p>
                </div>
                <div class="info-item">
                    <label>목표 설정 속도</label>
                    <input type="number" id="target-speed" class="input-field" placeholder="목표 km/h" min="0" step="1">
                </div>
                <div class="info-item">
                    <label>남은 거리</label>
                    <p id="remaining-distance">0.00 <span style="font-size: 12px; color: var(--text-light);">km</span></p>
                </div>
            </div>

            <div class="gps-info">
                <div class="info-item">
                    <label>위도</label>
                    <p id="latitude">-</p>
                </div>
                <div class="info-item">
                    <label>경도</label>
                    <p id="longitude">-</p>
                </div>
                <div class="info-item">
                    <label>정확도 / 상태</label>
                    <p id="accuracy">-</p>
                </div>
            </div>
            <div style="text-align: center; font-size: 12px; color: var(--text-light); margin-bottom: 10px;" id="gps-status">준비 중...</div>
        </div>

        <!-- 2️⃣ 지도 화면 탭 -->
        <div class="tab-content" id="map-tab" style="position: relative; padding: 0;">
            <div id="map" style="width: 100%; height: 100%; position: absolute; top: 0; left: 0; z-index: 1;"></div>

            <div class="map-top-overlay">
                <div class="map-top-bar">
                    <button class="map-float-btn" id="mapMenuBtn" style="width: 36px; height: 36px; font-size: 14px;">☰</button>
                    <div id="map-elapsed-time" class="map-top-time">0:00:00</div>
                    <button id="mapStartBtn" class="btn btn-primary" style="padding: 6px 12px; min-height: 32px; border-radius: 20px;">▶</button>
                </div>
                <div class="map-sub-stats">
                    <div class="map-stat-box">
                        <span id="map-current-distance" class="val">0.00</span>
                        <span class="label">km</span>
                    </div>
                    <div class="map-stat-box">
                        <span id="map-current-speed" class="val">0.0</span>
                        <span class="label">km/h</span>
                    </div>
                </div>
            </div>

            <!-- 편도/왕복 및 목적지 설정 패널 -->
            <div class="route-control-panel">
                <div style="display: flex; gap: 6px;">
                    <select id="routeType" style="flex: 1;">
                        <option value="one-way">편도 코스</option>
                        <option value="round-trip">왕복 코스 (반환점)</option>
                    </select>
                    <button id="setDestBtn" class="btn btn-primary" style="padding: 6px 10px; font-size: 12px; min-height: 30px;">목적지 지정</button>
                </div>
            </div>

            <div class="map-float-controls">
                <button class="map-float-btn" id="mapCurrentLocBtn" title="현재 위치">📍</button>
                <button class="map-float-btn" id="mapSettingsBtn" title="지도 설정">⚙️</button>
            </div>
        </div>

        <!-- 하단 고정 탭 바 -->
        <div class="tabs">
            <button class="tab-btn active" data-tab="speed">
                <span>⏱️</span>
                <span>속도계</span>
            </button>
            <button class="tab-btn" data-tab="map">
                <span>🗺️</span>
                <span>지도</span>
            </button>
        </div>
    </div>

    <!-- 설정 메뉴 모달 -->
    <div class="settings-menu" id="settings-menu">
        <div class="settings-title">메인 정보 선택</div>
        <div class="settings-grid">
            <button class="settings-btn" data-metric="time">시간</button>
            <button class="settings-btn" data-metric="speed">현재 속도</button>
            <button class="settings-btn" data-metric="avg-speed">평균 속도</button>
            <button class="settings-btn" data-metric="max-speed">최고 속도</button>
            <button class="settings-btn" data-metric="distance">거리</button>
            <button class="settings-btn" data-metric="altitude">고도</button>
        </div>
    </div>

    <!-- 스크립트 로드 -->
    <script src="config.js"></script>
    <script src="gps.js"></script>
    <script src="map.js"></script>
    <script src="app.js"></script>
    <script>
        // 카카오 맵 SDK 동적 로드 안전장치
        window.addEventListener('DOMContentLoaded', () => {
            if (typeof CONFIG !== 'undefined' && CONFIG.KAKAO_MAP_API_KEY) {
                const kakaoScript = document.createElement('script');
                kakaoScript.src = `//dapi.kakao.com/v2/maps/sdk.js?appkey=${CONFIG.KAKAO_MAP_API_KEY}&autoload=false`;
                kakaoScript.onload = () => {
                    kakao.maps.load(() => {
                        console.log("카카오 맵 로드 완료");
                    });
                };
                document.head.appendChild(kakaoScript);
            }
        });
    </script>
</body>
</html>
