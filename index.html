<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>자전거 GPS 트래커</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#121212">
    <meta name="description" content="실시간 자전거 속도 기록 및 경로 추적 웹앱">
</head>
<body>
    <!-- 🔍 진단 화면 (화면 상단에 고정) -->
    <div id="diagnostic" style="
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        background: #222;
        color: #0f0;
        font-family: 'Courier New', monospace;
        font-size: 9px;
        line-height: 1.2;
        max-height: 200px;
        overflow-y: auto;
        z-index: 10000;
        padding: 5px;
        border-bottom: 2px solid #0f0;
        display: none;
    ">
        <div style="font-weight: bold; margin-bottom: 3px; color: #ff0;">🔧 DIAGNOSTIC SYSTEM</div>
        <div id="diag-log"></div>
    </div>

    <div class="container" style="margin-top: 10px;">
        <!-- 1️⃣ 속도계 화면 탭 -->
        <div class="tab-content active" id="speed-tab">
            <div class="main-stats" id="main-stats-long-press">
                <div class="top-dashboard-bar">
                    <div id="elapsed-time" class="top-time-display">00:00:00</div>
                    <div class="mini-btn-group" style="display: flex; gap: 8px;">
                        <button id="startBtn" class="btn btn-primary" style="padding: 8px 14px; min-height: 36px; border-radius: 50%;">▶</button>
                        <button id="stopBtn" class="btn btn-danger" style="padding: 8px 14px; min-height: 36px; border-radius: 50%;" disabled>⏹</button>
                    </div>
                </div>

                <div class="speedometer-card">
                    <div class="stat-item">
                        <label>현재 속도</label>
                        <p id="current-speed" class="big-text">0.0</p>
                        <p class="speed-unit">km/h</p>
                    </div>
                    <div class="stat-item" style="margin-top: 5px;">
                        <p id="current-distance" class="sub-speedometer-stat">0.00<span>km</span></p>
                    </div>
                </div>
            </div>

            <div class="button-group">
                <button id="saveBtn" class="btn btn-success btn-large" disabled>🔴 기록 저장하기</button>
            </div>

            <div class="info-grid">
                <div class="info-item">
                    <label>평균 속도</label>
                    <p id="avg-speed">0.0 <span style="font-size: 12px; color: var(--text-light);">km/h</span></p>
                </div>
                <div class="info-item">
                    <label>최고 속도</label>
                    <p id="max-speed">0.0 <span style="font-size: 12px; color: var(--text-light);">km/h</span></p>
                </div>
                <div class="info-item">
                    <label>목표 설정 속도</label>
                    <input type="number" id="target-speed" class="input-field" placeholder="목표 km/h" min="0" step="1">
                </div>
                <div class="info-item">
                    <label>남은 거리</label>
                    <p id="remaining-distance">0.00 <span style="font-size: 12px; color: var(--text-light);">km</span></p>
                </div>
            </div>

            <div class="gps-info">
                <div class="info-item">
                    <label>위도</label>
                    <p id="latitude">-</p>
                </div>
                <div class="info-item">
                    <label>경도</label>
                    <p id="longitude">-</p>
                </div>
                <div class="info-item">
                    <label>정확도 / 상태</label>
                    <p id="accuracy">-</p>
                </div>
            </div>
            <div style="text-align: center; font-size: 12px; color: var(--text-light); margin-bottom: 10px;" id="gps-status">준비 중...</div>
        </div>

        <!-- 2️⃣ 지도 화면 탭 -->
        <div class="tab-content" id="map-tab">
            <div id="map" class="map-container"></div>
        </div>

        <div class="tabs">
            <button class="tab-btn active" data-tab="speed">⏱️ 속도계</button>
            <button class="tab-btn" data-tab="map">🗺️ 지도</button>
        </div>
    </div>

    <!-- 🔧 진단 시스템 -->
    <script>
        window.diagnostic = {
            logs: [],
            show() {
                document.getElementById('diagnostic').style.display = 'block';
            },
            hide() {
                document.getElementById('diagnostic').style.display = 'none';
            },
            add(msg, type = 'info') {
                const time = new Date().toLocaleTimeString();
                const prefix = {
                    'ok': '✅',
                    'error': '❌',
                    'warn': '⚠️',
                    'load': '📦',
                    'info': 'ℹ️'
                }[type] || '▶';
                
                const line = `${prefix} [${time}] ${msg}`;
                this.logs.push(line);
                console.log(line);
                
                const log = document.getElementById('diag-log');
                log.innerHTML += line + '<br>';
                log.scrollTop = log.scrollHeight;
                
                this.show();
                return this;
            }
        };

        diagnostic.add('시작...', 'load');
    </script>

    <!-- 1️⃣ config.js 로드 -->
    <script>
        diagnostic.add('config.js 로드 시작', 'load');
        window.__KAKAO_API_KEY__ = '${{ secrets.KAKAO_MAP_API_KEY }}';
    </script>
    <script src="config.js" onload="diagnostic.add('config.js 로드됨', 'ok')" onerror="diagnostic.add('config.js 로드 실패!', 'error')"></script>

    <!-- 2️⃣ 카카오 SDK 로드 -->
    <script>
        setTimeout(() => {
            diagnostic.add('CONFIG 확인 시작', 'info');
            
            if (typeof CONFIG === 'undefined') {
                diagnostic.add('CONFIG 미정의!', 'error');
                return;
            }
            
            diagnostic.add('CONFIG 정의됨: MAP.zoom=' + CONFIG.MAP.initialZoom, 'ok');
            
            const apiKey = CONFIG.KAKAO_MAP_API_KEY;
            if (!apiKey || apiKey.includes('secrets') || apiKey === 'YOUR_KAKAO_API_KEY') {
                diagnostic.add('⚠️ API 키 없음 (로컬 테스트 모드)', 'warn');
                setTimeout(loadAllScripts, 500);
                return;
            }
            
            diagnostic.add('카카오 SDK 로드 시작: ' + apiKey.substring(0, 10) + '...', 'load');
            
            const kakaoScript = document.createElement('script');
            kakaoScript.src = `//dapi.kakao.com/v2/maps/sdk.js?appkey=${apiKey}&autoload=false`;
            
            kakaoScript.onload = () => {
                diagnostic.add('카카오 SDK 스크립트 다운로드됨', 'ok');
                kakao.maps.load(() => {
                    diagnostic.add('kakao.maps 초기화됨', 'ok');
                    loadAllScripts();
                });
            };
            
            kakaoScript.onerror = () => {
                diagnostic.add('카카오 SDK 로드 실패!', 'error');
                setTimeout(loadAllScripts, 500);
            };
            
            document.head.appendChild(kakaoScript);
        }, 100);
    </script>

    <!-- 3️⃣ 나머지 스크립트 순차 로드 -->
    <script>
        function loadAllScripts() {
            diagnostic.add('스크립트 순차 로드 시작', 'load');
            
            const scripts = [
                { name: 'gps.js', check: 'gpsTracker' },
                { name: 'map.js', check: 'mapManager' },
                { name: 'app.js', check: 'BikeGPSApp' }
            ];
            
            let loaded = 0;
            
            function loadNext() {
                if (loaded >= scripts.length) {
                    diagnostic.add('모든 스크립트 로드 완료!', 'ok');
                    checkAllElements();
                    return;
                }
                
                const script = scripts[loaded];
                diagnostic.add(`로드 중: ${script.name}`, 'load');
                
                const el = document.createElement('script');
                el.src = script.name;
                
                el.onload = () => {
                    diagnostic.add(`${script.name} 다운로드됨`, 'ok');
                    
                    // 객체 확인
                    if (window[script.check]) {
                        diagnostic.add(`→ ${script.check} 생성됨`, 'ok');
                    } else {
                        diagnostic.add(`→ ${script.check} 미생성!`, 'error');
                    }
                    
                    loaded++;
                    setTimeout(loadNext, 100);
                };
                
                el.onerror = () => {
                    diagnostic.add(`${script.name} 로드 실패!`, 'error');
                    loaded++;
                    setTimeout(loadNext, 100);
                };
                
                document.body.appendChild(el);
            }
            
            loadNext();
        }
    </script>

    <!-- 4️⃣ 모든 요소 확인 -->
    <script>
        function checkAllElements() {
            diagnostic.add('DOM 요소 확인 시작', 'info');
            
            const elements = {
                'startBtn': '시작 버튼',
                'stopBtn': '중지 버튼',
                'saveBtn': '저장 버튼',
                'map': '지도',
                'elapsed-time': '경과 시간',
                'current-speed': '현재 속도',
                'gps-status': 'GPS 상태'
            };
            
            let foundAll = true;
            Object.entries(elements).forEach(([id, name]) => {
                if (document.getElementById(id)) {
                    diagnostic.add(`✓ ${name} (#${id})`, 'ok');
                } else {
                    diagnostic.add(`✗ ${name} (#${id}) 없음!`, 'error');
                    foundAll = false;
                }
            });
            
            if (!foundAll) {
                diagnostic.add('일부 DOM 요소 누락!', 'error');
            }
            
            diagnostic.add('객체 확인', 'info');
            const objects = [
                { name: 'gpsTracker', desc: 'GPS 추적기' },
                { name: 'mapManager', desc: '지도 관리자' },
                { name: 'app', desc: '앱 인스턴스' }
            ];
            
            objects.forEach(obj => {
                if (window[obj.name]) {
                    diagnostic.add(`✓ ${obj.desc} (${obj.name})`, 'ok');
                } else {
                    diagnostic.add(`✗ ${obj.desc} (${obj.name}) 없음!`, 'error');
                }
            });
            
            // 최종 상태
            setTimeout(() => {
                diagnostic.add('', 'info');
                if (document.getElementById('gps-status').textContent === '준비 중...') {
                    diagnostic.add('⚠️ 앱이 아직 초기화되지 않음!', 'warn');
                } else {
                    diagnostic.add('✅ 앱 정상 상태!', 'ok');
                }
            }, 500);
        }
    </script>

    <!-- 5️⃣ 전역 에러 캐치 -->
    <script>
        window.addEventListener('error', (e) => {
            diagnostic.add(`에러: ${e.message.substring(0, 50)}`, 'error');
        });
        
        window.addEventListener('unhandledrejection', (e) => {
            diagnostic.add(`Promise 에러: ${e.reason}`, 'error');
        });
    </script>
</body>
</html>
