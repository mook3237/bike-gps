<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#121212">
  <title>자전거 GPS 트래커</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="app-shell">
    <section id="speed-tab" class="tab-content active">
      <div class="main-stats">
        <div class="top-dashboard-bar">
          <div id="elapsed-time" class="top-time-display">00:00:00</div>
          <div class="mini-btn-group">
            <button id="startBtn" class="round-btn start" type="button" aria-label="추적 시작">▶</button>
            <button id="stopBtn" class="round-btn stop" type="button" aria-label="추적 중지" disabled>⏹</button>
          </div>
        </div>
        <div class="speedometer-card">
          <div class="stat-item">
            <label>현재 속도</label>
            <p id="current-speed" class="big-text">0.0</p>
            <p class="speed-unit">km/h</p>
          </div>
          <div class="stat-item distance-stat">
            <p id="current-distance" class="sub-speedometer-stat">0.00<span>km</span></p>
          </div>
        </div>
      </div>

      <div class="button-group">
        <button id="saveBtn" class="btn btn-success" type="button" disabled>💾 기록 저장하기</button>
      </div>

      <div class="info-grid">
        <div class="info-item"><label>평균 속도</label><p id="avg-speed">0.0 km/h</p></div>
        <div class="info-item"><label>최고 속도</label><p id="max-speed">0.0 km/h</p></div>
        <div class="info-item"><label>목표 속도</label><input id="target-speed" class="input-field" type="number" min="0" step="1" placeholder="예: 25"></div>
        <div class="info-item"><label>남은 거리</label><p id="remaining-distance">-</p></div>
      </div>

      <div class="gps-info">
        <div class="info-item"><label>위도</label><p id="latitude">-</p></div>
        <div class="info-item"><label>경도</label><p id="longitude">-</p></div>
        <div class="info-item"><label>정확도</label><p id="accuracy">-</p></div>
      </div>
      <div id="gps-status" class="status-text">준비 완료 · 지도 탭에서 목적지를 설정할 수 있습니다.</div>
    </section>

    <section id="map-tab" class="tab-content map-tab">
      <div class="nav-control-panel">
        <div class="nav-header">
          <div>
            <strong>자전거 길찾기</strong>
            <small id="route-status">자전거도로 우선</small>
          </div>
          <button id="locate-btn" class="nav-small-btn" type="button">📍 현재위치</button>
        </div>
        <div class="nav-toggle-group" role="group" aria-label="경로 유형">
          <button class="nav-toggle-btn active" data-mode="single" type="button">편도</button>
          <button class="nav-toggle-btn" data-mode="round" type="button">왕복</button>
        </div>
        <div class="nav-input-group">
          <input id="destination-input" class="nav-input" type="search" autocomplete="off" enterkeyhint="search" placeholder="주소/장소 입력 후 Enter">
          <button id="search-nav-btn" class="nav-search-btn" type="button">검색</button>
          <button id="clear-nav-btn" class="nav-btn-clear" type="button" aria-label="목적지 지우기">✕</button>
        </div>
        <div id="search-results" class="search-results" hidden></div>
        <div class="nav-info-panel">
          <div class="nav-info-item"><span>거리</span><strong id="nav-distance">-</strong></div>
          <div class="nav-info-item"><span>예상시간</span><strong id="nav-time">-</strong></div>
          <div class="nav-info-item"><span>경로</span><strong id="nav-route-type">자전거 우선</strong></div>
        </div>
        <div class="route-note">자전거 전용도로가 연결되지 않는 구간은 일반도로를 이용할 수 있습니다.</div>
      </div>
      <div id="map" class="map-container"></div>
    </section>

    <nav class="tabs" aria-label="주 메뉴">
      <button class="tab-btn active" data-tab="speed" type="button"><span>⏱️</span><span>속도계</span></button>
      <button class="tab-btn" data-tab="map" type="button"><span>🗺️</span><span>지도</span></button>
    </nav>
  </main>

  <script src="config.js"></script>
  <script>
    (function loadKakao(){
      const key = window.APP_CONFIG?.KAKAO_MAP_API_KEY;
      const finish = () => {
        const s = document.createElement('script'); s.src = 'gps.js'; document.body.appendChild(s);
        const m = document.createElement('script'); m.src = 'map.js'; document.body.appendChild(m);
        const n = document.createElement('script'); n.src = 'navigation.js'; document.body.appendChild(n);
        const a = document.createElement('script'); a.src = 'app.js'; document.body.appendChild(a);
      };
      if (!key || key === 'YOUR_KAKAO_JAVASCRIPT_KEY') {
        console.warn('Kakao Maps key is not configured. Map/search will be disabled until config.js is filled.');
        finish(); return;
      }
      const script = document.createElement('script');
      script.src = `https://dapi.kakao.com/v2/maps/sdk.js?appkey=${encodeURIComponent(key)}&autoload=false&libraries=services`;
      script.onload = () => kakao.maps.load(finish);
      script.onerror = () => { console.error('Kakao Maps SDK failed to load'); finish(); };
      document.head.appendChild(script);
    })();
  </script>
</body>
</html>
