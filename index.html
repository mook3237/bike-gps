<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>자전거 GPS 트래커</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#121212">
</head>
<body>
    <!-- 진단 패널 (최소 높이) -->
    <div id="diagnostic" style="
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        background: #222;
        color: #0f0;
        font-family: monospace;
        font-size: 8px;
        line-height: 1.1;
        max-height: 80px;
        overflow-y: auto;
        z-index: 10000;
        padding: 3px;
        border-bottom: 2px solid #0f0;
        display: none;
    ">
        <div id="diag-log"></div>
    </div>

    <div class="container" style="margin-top: 5px;">
        <div class="tab-content active" id="speed-tab">
            <div class="main-stats" id="main-stats-long-press">
                <div class="top-dashboard-bar">
                    <div id="elapsed-time" class="top-time-display">00:00:00</div>
                    <div class="mini-btn-group" style="display: flex; gap: 8px;">
                        <button id="startBtn" class="btn btn-primary" style="padding: 8px 14px; min-height: 36px; border-radius: 50%;">▶</button>
                        <button id="stopBtn" class="btn btn-danger" style="padding: 8px 14px; min-height: 36px; border-radius: 50%;" disabled>⏹</button>
                    </div>
                </div>

                <div class="speedometer-card">
                    <div class="stat-item">
                        <label>현재 속도</label>
                        <p id="current-speed" class="big-text">0.0</p>
                        <p class="speed-unit">km/h</p>
                    </div>
                    <div class="stat-item" style="margin-top: 5px;">
                        <p id="current-distance" class="sub-speedometer-stat">0.00<span>km</span></p>
                    </div>
                </div>
            </div>

            <div class="button-group">
                <button id="saveBtn" class="btn btn-success btn-large" disabled>🔴 기록 저장하기</button>
            </div>

            <div class="info-grid">
                <div class="info-item">
                    <label>평균 속도</label>
                    <p id="avg-speed">0.0 <span style="font-size: 12px; color: var(--text-light);">km/h</span></p>
                </div>
                <div class="info-item">
                    <label>최고 속도</label>
                    <p id="max-speed">0.0 <span style="font-size: 12px; color: var(--text-light);">km/h</span></p>
                </div>
                <div class="info-item">
                    <label>목표 설정 속도</label>
                    <input type="number" id="target-speed" class="input-field" placeholder="목표 km/h" min="0" step="1">
                </div>
                <div class="info-item">
                    <label>남은 거리</label>
                    <p id="remaining-distance">0.00 <span style="font-size: 12px; color: var(--text-light);">km</span></p>
                </div>
            </div>

            <div class="gps-info">
                <div class="info-item">
                    <label>위도</label>
                    <p id="latitude">-</p>
                </div>
                <div class="info-item">
                    <label>경도</label>
                    <p id="longitude">-</p>
                </div>
                <div class="info-item">
                    <label>정확도 / 상태</label>
                    <p id="accuracy">-</p>
                </div>
            </div>
            <div style="text-align: center; font-size: 12px; color: var(--text-light); margin-bottom: 10px;" id="gps-status">준비 중...</div>
        </div>

        <div class="tab-content" id="map-tab">
            <div id="map" class="map-container"></div>
        </div>

        <div class="tabs">
            <button class="tab-btn active" data-tab="speed">⏱️ 속도계</button>
            <button class="tab-btn" data-tab="map">🗺️ 지도</button>
        </div>
    </div>

    <script>
        window.diagnostic = {
            logs: [],
            add(msg) {
                const time = new Date().toLocaleTimeString();
                const line = `[${time}] ${msg}`;
                this.logs.push(line);
                console.log(line);
                const log = document.getElementById('diag-log');
                log.innerHTML += line + '<br>';
                log.scrollTop = log.scrollHeight;
                document.getElementById('diagnostic').style.display = 'block';
            }
        };
        diagnostic.add('시작');
    </script>

    <script>
        diagnostic.add('config.js 로드');
        window.__KAKAO_API_KEY__ = '${{ secrets.KAKAO_MAP_API_KEY }}';
    </script>
    <script src="config.js"></script>

    <script>
        setTimeout(() => {
            if (typeof CONFIG === 'undefined') {
                diagnostic.add('ERROR: CONFIG 없음');
                return;
            }
            diagnostic.add('CONFIG 로드됨');
            
            const apiKey = CONFIG.KAKAO_MAP_API_KEY;
            if (!apiKey || apiKey.includes('secrets')) {
                diagnostic.add('로컬모드');
                setTimeout(loadAllScripts, 500);
                return;
            }
            
            diagnostic.add('카카오 SDK 로드');
            const kakaoScript = document.createElement('script');
            kakaoScript.src = `//dapi.kakao.com/v2/maps/sdk.js?appkey=${apiKey}&autoload=false`;
            kakaoScript.onload = () => {
                diagnostic.add('SDK 준비');
                kakao.maps.load(() => {
                    diagnostic.add('maps 로드됨');
                    loadAllScripts();
                });
            };
            kakaoScript.onerror = () => {
                diagnostic.add('SDK 에러');
                loadAllScripts();
            };
            document.head.appendChild(kakaoScript);
        }, 100);
    </script>

    <script>
        function loadAllScripts() {
            diagnostic.add('스크립트 로드 시작');
            const scripts = ['gps.js', 'map.js', 'app.js'];
            let loaded = 0;
            
            function loadNext() {
                if (loaded >= scripts.length) {
                    diagnostic.add('완료!');
                    setTimeout(checkAllElements, 2000);
                    return;
                }
                
                const script = scripts[loaded];
                diagnostic.add(script + ' 로드');
                
                const el = document.createElement('script');
                el.src = script;
                el.onload = () => {
                    diagnostic.add(script + ' OK');
                    loaded++;
                    setTimeout(loadNext, 100);
                };
                el.onerror = () => {
                    diagnostic.add(script + ' ERROR!');
                    loaded++;
                    setTimeout(loadNext, 100);
                };
                document.body.appendChild(el);
            }
            loadNext();
        }

        function checkAllElements() {
            if (window.app) {
                diagnostic.add('앱 시작됨!');
            } else {
                diagnostic.add('앱 미생성');
            }
        }
    </script>

    <script>
        window.addEventListener('error', (e) => {
            diagnostic.add('ERROR: ' + e.message.substring(0, 30));
        });
    </script>
</body>
</html>
