<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <title>자전거 GPS 트래커</title>

    <link
        rel="stylesheet"
        href="styles.css"
    >

    <link
        rel="manifest"
        href="manifest.json"
    >

    <link
        rel="icon"
        href="favicon.svg"
        type="image/svg+xml"
    >

    <link
        rel="apple-touch-icon"
        href="favicon.svg"
    >

    <meta
        name="theme-color"
        content="#4CAF50"
    >

    <meta
        name="description"
        content="실시간 자전거 속도 기록 및 경로 추적 웹앱"
    >

    <script>
        window.__KAKAO_API_KEY__ =
            '${{ secrets.KAKAO_MAP_API_KEY }}';
    </script>

</head>


<body>

<div class="container">


    <!-- ========================================= -->
    <!-- 헤더 -->
    <!-- ========================================= -->

    <header class="header">

        <h1>🚴 자전거 GPS 트래커</h1>

        <p class="subtitle">
            자전거 기록과 길안내를 한 곳에서
        </p>

    </header>


    <!-- ========================================= -->
    <!-- 탭 -->
    <!-- ========================================= -->

    <div class="tabs">

        <!-- 지도 메인 -->

        <button
            class="tab-btn active"
            data-tab="map"
        >
            지도
        </button>


        <!-- 기록 -->

        <button
            class="tab-btn"
            data-tab="speed"
        >
            기록
        </button>

    </div>


    <!-- ========================================= -->
    <!-- 지도 탭 -->
    <!-- ========================================= -->

    <div
        class="tab-content active map-tab-content"
        id="map-tab"
    >

        <div
            id="map"
            class="map-container"
        >


            <!-- ========================================= -->
            <!-- 출발 / 도착 검색 UI -->
            <!-- ========================================= -->

            <div
                id="location-panel"
                class="location-panel"
            >

                <div class="location-row">

                    <div class="location-dot start-dot"></div>

                    <div class="location-input-wrap">

                        <span class="location-label">
                            출발
                        </span>

                        <span
                            id="origin-address"
                            class="location-address"
                        >
                            현재 위치
                        </span>

                    </div>

                </div>


                <div class="location-divider"></div>


                <div class="location-row">

                    <div class="location-dot destination-dot"></div>

                    <div class="location-input-wrap">

                        <span class="location-label">
                            도착
                        </span>

                        <span
                            id="destination-address"
                            class="location-address"
                        >
                            목적지를 설정하세요
                        </span>

                    </div>

                </div>


                <!-- 경유지 추가 -->

                <button
                    id="add-waypoint-button"
                    class="waypoint-button"
                    type="button"
                    title="경유지 추가"
                >
                    +
                </button>


                <!-- 목적지 닫기 -->

                <button
                    id="location-panel-close"
                    class="location-panel-close"
                    type="button"
                    title="목적지 취소"
                >
                    ×
                </button>

            </div>


            <!-- ========================================= -->
            <!-- 지도 버튼 -->
            <!-- ========================================= -->

            <div class="map-control-buttons">


                <button
                    id="destination-button"
                    class="map-floating-button"
                    type="button"
                    title="목적지 설정"
                >
                    🎯
                </button>


                <button
                    id="current-location-button"
                    class="map-floating-button"
                    type="button"
                    title="현재 위치"
                >
                    📍
                </button>


            </div>


            <!-- ========================================= -->
            <!-- 지도 축척 -->
            <!-- ========================================= -->

            <div
                id="map-scale"
                class="map-scale"
            >

                <div class="map-scale-line"></div>

                <span id="map-scale-text">
                    50m
                </span>

            </div>


            <!-- ========================================= -->
            <!-- 경로 선택 카드 -->
            <!-- ========================================= -->

            <div
                id="route-selector"
                class="route-selector"
            >

                <div class="route-selector-header">

                    <span>
                        경로 선택
                    </span>

                    <button
                        id="route-selector-close"
                        type="button"
                    >
                        ×
                    </button>

                </div>


                <div
                    id="route-card-list"
                    class="route-card-list"
                ></div>

            </div>


            <!-- ========================================= -->
            <!-- 목표 속도 카드 -->
            <!-- ========================================= -->

            <div
                id="target-speed-modal"
                class="target-speed-modal"
            >

                <div class="target-speed-card">

                    <h2>
                        목표 속도 설정
                    </h2>


                    <p>
                        목표 속도를 설정하면<br>
                        실제 주행 속도와 비교할 수 있습니다.
                    </p>


                    <div class="target-speed-input-wrap">

                        <input
                            type="number"
                            id="route-target-speed"
                            placeholder="예: 20"
                            min="1"
                            max="100"
                            step="1"
                        >

                        <span>
                            km/h
                        </span>

                    </div>


                    <div class="target-speed-actions">

                        <button
                            id="skip-target-speed"
                            class="target-skip-button"
                            type="button"
                        >
                            건너뛰기
                        </button>


                        <button
                            id="confirm-target-speed"
                            class="target-confirm-button"
                            type="button"
                        >
                            선택
                        </button>

                    </div>

                </div>

            </div>


            <!-- ========================================= -->
            <!-- 길안내 시작 -->
            <!-- ========================================= -->

            <button
                id="navigation-start-button"
                class="navigation-start-button"
                type="button"
            >
                🧭 길안내 시작
            </button>


        </div>

    </div>


    <!-- ========================================= -->
    <!-- 기록 탭 -->
    <!-- ========================================= -->

    <div
        class="tab-content"
        id="speed-tab"
    >


        <!-- 메인 정보 -->

        <div
            class="main-stats"
            id="main-stats-long-press"
        >

            <div class="stat-item">

                <label>
                    시간
                </label>

                <p
                    id="elapsed-time"
                    class="big-text"
                >
                    00:00:00
                </p>

            </div>


            <div class="stat-item">

                <label>
                    시속
                </label>

                <p
                    id="current-speed"
                    class="big-text"
                >
                    0.0 km/h
                </p>

            </div>

        </div>


        <!-- 설정 메뉴 -->

        <div
            class="settings-menu"
            id="settings-menu"
        >

            <div class="settings-title">
                메인 정보 선택
            </div>


            <div class="settings-grid">

                <button
                    class="settings-btn"
                    data-metric="time"
                >
                    시간
                </button>


                <button
                    class="settings-btn"
                    data-metric="speed"
                >
                    현재 속도
                </button>


                <button
                    class="settings-btn"
                    data-metric="avg-speed"
                >
                    평균 속도
                </button>


                <button
                    class="settings-btn"
                    data-metric="max-speed"
                >
                    최고 속도
                </button>


                <button
                    class="settings-btn"
                    data-metric="distance"
                >
                    거리
                </button>


                <button
                    class="settings-btn"
                    data-metric="altitude"
                >
                    고도
                </button>

            </div>

        </div>


        <!-- 기록 버튼 -->

        <div class="button-group">

            <button
                id="startBtn"
                class="btn btn-primary btn-large"
            >
                위치 추적 시작
            </button>


            <button
                id="saveBtn"
                class="btn btn-success btn-large"
                disabled
            >
                🔴 기록 저장하기
            </button>


            <button
                id="stopBtn"
                class="btn btn-danger btn-large"
                disabled
            >
                추적 중지
            </button>

        </div>


        <!-- 상세 정보 -->

        <div class="info-grid">


            <div class="info-item">

                <label>
                    평균속도
                </label>

                <p
                    id="avg-speed"
                    class="medium-text"
                >
                    0.0 km/h
                </p>

            </div>


            <div class="info-item">

                <label>
                    최고속도
                </label>

                <p
                    id="max-speed"
                    class="medium-text"
                >
                    0.0 km/h
                </p>

            </div>


            <div class="info-item">

                <label>
                    현재 거리
                </label>

                <p
                    id="current-distance"
                    class="medium-text"
                >
                    0.00 km
                </p>

            </div>


            <div class="info-item">

                <label>
                    남은 거리
                </label>

                <p
                    id="remaining-distance"
                    class="medium-text"
                >
                    0.00 km
                </p>

            </div>


            <div class="info-item">

                <label>
                    설정 평균
                </label>

                <input
                    type="number"
                    id="target-speed"
                    class="input-field"
                    placeholder="목표 속도 (km/h)"
                    min="0"
                    step="1"
                >

            </div>


            <div class="info-item">

                <label>
                    GPS 상태
                </label>

                <p
                    id="gps-status"
                    class="medium-text"
                >
                    준비 중...
                </p>

            </div>

        </div>


        <!-- GPS 정보 -->

        <div class="gps-info">


            <div class="info-item">

                <label>
                    위도
                </label>

                <p id="latitude">
                    -
                </p>

            </div>


            <div class="info-item">

                <label>
                    경도
                </label>

                <p id="longitude">
                    -
                </p>

            </div>


            <div class="info-item">

                <label>
                    정확도
                </label>

                <p id="accuracy">
                    -
                </p>

            </div>


        </div>


    </div>


</div>


<!-- ========================================= -->
<!-- CONFIG -->
<!-- ========================================= -->

<script
    src="/api/config.js"
    onerror="
        console.error(
            '❌ Vercel CONFIG를 불러올 수 없습니다.'
        )
    "
></script>


<script>

    if (typeof CONFIG === 'undefined') {

        window.CONFIG = {

            KAKAO_MAP_API_KEY:

                window.__KAKAO_API_KEY__ || '',

            MAP: {

                initialZoom: 3,

                centerLat: 37.4979,

                centerLng: 127.0276

            },

            GPS: {

                highAccuracy: true,

                timeout: 10000,

                maximumAge: 0

            }

        };

    }

</script>


<!-- GPS -->

<script src="gps.js"></script>


<!-- 카카오 지도 -->

<script>

    const mapScript =
        document.createElement('script');


    const appScript =
        document.createElement('script');


    mapScript.src =
        'map.js';


    appScript.src =
        'app.js';


    function initKakaoSDK() {

        const kakaoScript =
            document.createElement('script');


        kakaoScript.src =

            `//dapi.kakao.com/v2/maps/sdk.js?appkey=${CONFIG.KAKAO_MAP_API_KEY}&libraries=services&autoload=false`;


        kakaoScript.onload =
            () => {

                console.log(
                    '✅ 카카오 SDK 로드 완료!'
                );


                kakao.maps.load(
                    () => {

                        console.log(
                            '✅ kakao.maps 준비 완료!'
                        );


                        document.body.appendChild(
                            mapScript
                        );


                        mapScript.onload =
                            () => {

                                console.log(
                                    '✅ map.js 로드 완료!'
                                );


                                document.body.appendChild(
                                    appScript
                                );

                            };

                    }
                );

            };


        kakaoScript.onerror =
            () => {

                console.error(
                    '❌ 카카오 SDK 로드 실패!'
                );


                const gpsStatus =
                    document.getElementById(
                        'gps-status'
                    );


                if (gpsStatus) {

                    gpsStatus.textContent =
                        '❌ 카카오 지도 통신 실패';

                }

            };


        document.head.appendChild(
            kakaoScript
        );

    }


    const hasValidKey =

        CONFIG.KAKAO_MAP_API_KEY &&

        !CONFIG.KAKAO_MAP_API_KEY.includes(
            '${{'
        );


    if (hasValidKey) {

        initKakaoSDK();

    } else {

        console.error(
            '❌ 카카오 API 키가 설정되지 않았습니다.'
        );

    }

</script>


</body>
</html>
