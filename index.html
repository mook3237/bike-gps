<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>자전거 GPS 트래커</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="favicon.svg">
    <meta name="theme-color" content="#121212">
    <meta name="description" content="실시간 자전거 속도 기록 및 경로 추적 웹앱">
</head>
<body>
    <!-- 🔍 디버그 패널 (항상 보임!) -->
    <div id="debug-panel" style="
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        background: #000;
        color: #0f0;
        font-family: monospace;
        font-size: 10px;
        max-height: 150px;
        overflow-y: auto;
        z-index: 9999;
        border-bottom: 2px solid #0f0;
        padding: 5px;
        display: none;
    ">
        <div style="font-weight: bold; margin-bottom: 5px;">🔧 DEBUG LOG</div>
        <div id="debug-log"></div>
        <button onclick="document.getElementById('debug-panel').style.display='none'" style="
            position: absolute;
            top: 2px;
            right: 2px;
            background: #0f0;
            color: #000;
            border: none;
            padding: 2px 5px;
            cursor: pointer;
            font-size: 10px;
        ">✕</button>
    </div>

    <div class="container" style="margin-top: 150px;">
        <!-- 1️⃣ 속도계 화면 탭 -->
        <div class="tab-content active" id="speed-tab">
            <!-- 상단 대시보드 (시간 및 메인 긴 누름 영역) -->
            <div class="main-stats" id="main-stats-long-press">
                <div class="top-dashboard-bar">
                    <div id="elapsed-time" class="top-time-display">00:00:00</div>
                    <div class="mini-btn-group" style="display: flex; gap: 8px;">
                        <button id="startBtn" class="btn btn-primary" style="padding: 8px 14px; min-height: 36px; border-radius: 50%;">▶</button>
                        <button id="stopBtn" class="btn btn-danger" style="padding: 8px 14px; min-height: 36px; border-radius: 50%;" disabled>⏹</button>
                    </div>
                </div>

                <!-- 속도계 원형 디자인 카드 -->
                <div class="speedometer-card">
                    <div class="stat-item">
                        <label>현재 속도</label>
                        <p id="current-speed" class="big-text">0.0</p>
                        <p class="speed-unit">km/h</p>
                    </div>
                    <div class="stat-item" style="margin-top: 5px;">
                        <p id="current-distance" class="sub-speedometer-stat">0.00<span>km</span></p>
                    </div>
                </div>
            </div>

            <!-- 기록 저장 버튼 -->
            <div class="button-group">
                <button id="saveBtn" class="btn btn-success btn-large" disabled>🔴 기록 저장하기</button>
            </div>

            <!-- 상세 정보 그리드 -->
            <div class="info-grid">
                <div class="info-item">
                    <label>평균 속도</label>
                    <p id="avg-speed">0.0 <span style="font-size: 12px; color: var(--text-light);">km/h</span></p>
                </div>
                <div class="info-item">
                    <label>최고 속도</label>
                    <p id="max-speed">0.0 <span style="font-size: 12px; color: var(--text-light);">km/h</span></p>
                </div>
                <div class="info-item">
                    <label>목표 설정 속도</label>
                    <input type="number" id="target-speed" class="input-field" placeholder="목표 km/h" min="0" step="1">
                </div>
                <div class="info-item">
                    <label>남은 거리</label>
                    <p id="remaining-distance">0.00 <span style="font-size: 12px; color: var(--text-light);">km</span></p>
                </div>
            </div>

            <!-- GPS 상세 정보 -->
            <div class="gps-info">
                <div class="info-item">
                    <label>위도</label>
                    <p id="latitude">-</p>
                </div>
                <div class="info-item">
                    <label>경도</label>
                    <p id="longitude">-</p>
                </div>
                <div class="info-item">
                    <label>정확도 / 상태</label>
                    <p id="accuracy">-</p>
                </div>
            </div>
            <div style="text-align: center; font-size: 12px; color: var(--text-light); margin-bottom: 10px;" id="gps-status">준비 중...</div>
        </div>

        <!-- 2️⃣ 지도 화면 탭 -->
        <div class="tab-content" id="map-tab">
            <div id="map" class="map-container"></div>
        </div>

        <!-- 하단 고정 탭 네비게이션 -->
        <div class="tabs">
            <button class="tab-btn active" data-tab="speed">
                <span>⏱️</span>
                <span>속도계</span>
            </button>
            <button class="tab-btn" data-tab="map">
                <span>🗺️</span>
                <span>지도</span>
            </button>
        </div>
    </div>

    <!-- 🔧 디버그 시스템 -->
    <script>
        // 디버그 로그를 UI와 콘솔에 동시 출력
        window.debugLog = [];
        window.showDebug = function() {
            document.getElementById('debug-panel').style.display = 'block';
        };

        window.addDebug = function(msg) {
            const time = new Date().toLocaleTimeString();
            const log = `[${time}] ${msg}`;
            window.debugLog.push(log);
            console.log(log);
            
            // UI에 표시
            const logDiv = document.getElementById('debug-log');
            if (logDiv) {
                logDiv.innerHTML += log + '<br>';
                logDiv.scrollTop = logDiv.scrollHeight;
            }
            
            // 자동으로 패널 표시
            if (!document.getElementById('debug-panel').style.display || document.getElementById('debug-panel').style.display === 'none') {
                showDebug();
            }
        };

        // 페이지 로드 시작
        addDebug('📄 index.html 로드 시작');
        addDebug('🌐 브라우저: ' + navigator.userAgent.substring(0, 50));
    </script>

    <!-- config.js -->
    <script>
        addDebug('⏳ config.js 로드 시작...');
    </script>
    <script src="config.js"></script>
    <script>
        addDebug('✅ config.js 로드 완료');
        if (typeof CONFIG === 'undefined') {
            addDebug('❌ ERROR: CONFIG 미정의!');
        } else {
            addDebug('✅ CONFIG 존재: ' + JSON.stringify(CONFIG.MAP));
        }
    </script>

    <!-- Kakao SDK 로드 -->
    <script>
        addDebug('⏳ Kakao SDK 로드 시작...');
        const kakaoScript = document.createElement('script');
        
        if (!CONFIG || !CONFIG.KAKAO_MAP_API_KEY) {
            addDebug('❌ ERROR: Kakao API 키 없음!');
            kakaoScript.src = '//dapi.kakao.com/v2/maps/sdk.js?appkey=YOUR_KEY&autoload=false';
        } else {
            kakaoScript.src = `//dapi.kakao.com/v2/maps/sdk.js?appkey=${CONFIG.KAKAO_MAP_API_KEY}&autoload=false`;
            addDebug('✅ API 키 설정됨');
        }

        kakaoScript.onload = function() {
            addDebug('✅ Kakao SDK 스크립트 로드됨');
            kakao.maps.load(function() {
                addDebug('✅ kakao.maps 초기화됨');
                loadNextScripts();
            });
        };

        kakaoScript.onerror = function() {
            addDebug('❌ ERROR: Kakao SDK 로드 실패!');
        };

        document.head.appendChild(kakaoScript);
    </script>

    <!-- 나머지 스크립트 순차 로드 -->
    <script>
        function loadNextScripts() {
            addDebug('⏳ gps.js 로드 시작...');
            
            const gpsScript = document.createElement('script');
            gpsScript.src = 'gps.js';
            gpsScript.onload = function() {
                addDebug('✅ gps.js 로드됨');
                if (typeof gpsTracker === 'undefined') {
                    addDebug('❌ ERROR: gpsTracker 미정의!');
                } else {
                    addDebug('✅ gpsTracker 존재');
                }
                
                addDebug('⏳ map.js 로드 시작...');
                const mapScript = document.createElement('script');
                mapScript.src = 'map.js';
                mapScript.onload = function() {
                    addDebug('✅ map.js 로드됨');
                    if (typeof mapManager === 'undefined') {
                        addDebug('❌ ERROR: mapManager 미정의!');
                    } else {
                        addDebug('✅ mapManager 존재');
                    }
                    
                    addDebug('⏳ app.js 로드 시작...');
                    const appScript = document.createElement('script');
                    appScript.src = 'app.js';
                    appScript.onload = function() {
                        addDebug('✅ app.js 로드됨');
                        addDebug('🎉 모든 스크립트 로드 완료!');
                    };
                    appScript.onerror = function() {
                        addDebug('❌ ERROR: app.js 로드 실패!');
                    };
                    document.body.appendChild(appScript);
                };
                mapScript.onerror = function() {
                    addDebug('❌ ERROR: map.js 로드 실패!');
                };
                document.body.appendChild(mapScript);
            };
            gpsScript.onerror = function() {
                addDebug('❌ ERROR: gps.js 로드 실패!');
            };
            document.body.appendChild(gpsScript);
        }
    </script>

    <!-- 버튼 클릭 감지 -->
    <script>
        setTimeout(() => {
            addDebug('🔍 버튼 감지 시작...');
            
            const startBtn = document.getElementById('startBtn');
            const stopBtn = document.getElementById('stopBtn');
            const saveBtn = document.getElementById('saveBtn');
            const tabBtns = document.querySelectorAll('.tab-btn');
            
            if (startBtn) {
                addDebug('✅ startBtn 발견');
                startBtn.addEventListener('click', function() {
                    addDebug('⚡ startBtn 클릭됨!');
                }, true); // capture phase
            } else {
                addDebug('❌ ERROR: startBtn 없음!');
            }
            
            if (stopBtn) {
                addDebug('✅ stopBtn 발견');
                stopBtn.addEventListener('click', function() {
                    addDebug('⚡ stopBtn 클릭됨!');
                }, true);
            } else {
                addDebug('❌ ERROR: stopBtn 없음!');
            }
            
            if (saveBtn) {
                addDebug('✅ saveBtn 발견');
                saveBtn.addEventListener('click', function() {
                    addDebug('⚡ saveBtn 클릭됨!');
                }, true);
            } else {
                addDebug('❌ ERROR: saveBtn 없음!');
            }
            
            addDebug('✅ 탭 버튼 ' + tabBtns.length + '개 발견');
        }, 1000);
    </script>

</body>
</html>
