<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>자전거 GPS 트래커</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="favicon.svg">
    <meta name="theme-color" content="#121212">
    <meta name="description" content="실시간 자전거 속도 기록 및 경로 추적 웹앱">
</head>
<body>
    <div class="container">
        <!-- 1️⃣ 속도계 화면 탭 -->
        <div class="tab-content active" id="speed-tab">
            <div class="main-stats" id="main-stats-long-press">
                <div class="top-dashboard-bar">
                    <div id="elapsed-time" class="top-time-display">00:00:00</div>
                    <div class="mini-btn-group" style="display: flex; gap: 8px;">
                        <button id="startBtn" class="btn btn-primary" style="padding: 8px 14px; min-height: 36px; border-radius: 50%;">▶</button>
                        <button id="stopBtn" class="btn btn-danger" style="padding: 8px 14px; min-height: 36px; border-radius: 50%;" disabled>⏹</button>
                    </div>
                </div>

                <div class="speedometer-card">
                    <div class="stat-item">
                        <label>현재 속도</label>
                        <p id="current-speed" class="big-text">0.0</p>
                        <p class="speed-unit">km/h</p>
                    </div>
                    <div class="stat-item" style="margin-top: 5px;">
                        <p id="current-distance" class="sub-speedometer-stat">0.00<span>km</span></p>
                    </div>
                </div>
            </div>

            <div class="button-group">
                <button id="saveBtn" class="btn btn-success btn-large" disabled>🔴 기록 저장하기</button>
            </div>

            <div class="info-grid">
                <div class="info-item">
                    <label>평균 속도</label>
                    <p id="avg-speed">0.0 <span style="font-size: 12px; color: var(--text-light);">km/h</span></p>
                </div>
                <div class="info-item">
                    <label>최고 속도</label>
                    <p id="max-speed">0.0 <span style="font-size: 12px; color: var(--text-light);">km/h</span></p>
                </div>
                <div class="info-item">
                    <label>목표 설정 속도</label>
                    <input type="number" id="target-speed" class="input-field" placeholder="목표 km/h" min="0" step="1">
                </div>
                <div class="info-item">
                    <label>남은 거리</label>
                    <p id="remaining-distance">0.00 <span style="font-size: 12px; color: var(--text-light);">km</span></p>
                </div>
            </div>

            <div class="gps-info">
                <div class="info-item">
                    <label>위도</label>
                    <p id="latitude">-</p>
                </div>
                <div class="info-item">
                    <label>경도</label>
                    <p id="longitude">-</p>
                </div>
                <div class="info-item">
                    <label>정확도 / 상태</label>
                    <p id="accuracy">-</p>
                </div>
            </div>
            <div style="text-align: center; font-size: 12px; color: var(--text-light); margin-bottom: 10px;" id="gps-status">준비 중...</div>
        </div>

        <!-- 2️⃣ 지도 화면 탭 -->
        <div class="tab-content" id="map-tab">
            <div class="nav-control-panel" id="nav-control-panel">
                <div class="nav-toggle-group">
                    <button class="nav-toggle-btn active" data-mode="single">편도</button>
                    <button class="nav-toggle-btn" data-mode="round">왕복</button>
                </div>
                <div class="nav-input-group">
                    <input type="text" id="destination-input" class="nav-input" placeholder="목적지 입력 또는 지도 클릭">
                    <button id="clear-nav-btn" class="nav-btn-clear">✕</button>
                </div>
                <div class="nav-info-panel">
                    <div class="nav-info-item">
                        <span class="nav-label">거리</span>
                        <span id="nav-distance" class="nav-value">-</span>
                    </div>
                    <div class="nav-info-item">
                        <span class="nav-label">예상 시간</span>
                        <span id="nav-time" class="nav-value">-</span>
                    </div>
                </div>
            </div>
            
            <div id="map" class="map-container"></div>
        </div>

        <div class="tabs">
            <button class="tab-btn active" data-tab="speed">
                <span>⏱️</span>
                <span>속도계</span>
            </button>
            <button class="tab-btn" data-tab="map">
                <span>🗺️</span>
                <span>지도</span>
            </button>
        </div>
    </div>

    <!-- ✅ 깃허브 시크릿 키 안전 주입부 (빌드 시 치환됨) -->
    <script>
        window.__KAKAO_API_KEY__ = '${{ secrets.KAKAO_MAP_API_KEY }}';
    </script>

    <script src="config.js"></script>
    <script>
        try {
            if (typeof CONFIG !== 'undefined' && CONFIG.KAKAO_MAP_API_KEY) {
                document.write(`<script src="//dapi.kakao.com/v2/maps/sdk.js?appkey=${CONFIG.KAKAO_MAP_API_KEY}&autoload=false"><\/script>`);
                console.log('✅ 카카오맵 SDK 스크립트 동적 삽입 성공');
            } else {
                console.error('❌ CONFIG 또는 API 키가 존재하지 않습니다.');
            }
        } catch (e) {
            console.error('❌ 카카오맵 SDK 로드 중 예외 발생:', e);
        }
    </script>

    <!-- 파일별 로드 에러 추적 래퍼 -->
    <script>
        function loadScriptSafely(src) {
            const script = document.createElement('script');
            script.src = src;
            script.onerror = () => console.error(`❌ [파일 로드 실패] ${src} 파일을 찾을 수 없습니다.`);
            script.onload = () => console.log(`✅ [파일 로드 성공] ${src}`);
            document.body.appendChild(script);
        }

        loadScriptSafely('gps.js');
        loadScriptSafely('map.js');
        loadScriptSafely('navigation.js');
        loadScriptSafely('app.js');
    </script>

    <!-- 전체 DOM 및 버튼 상태 진단 스크립트 -->
    <script>
        window.addEventListener('error', function(event) {
            console.error(`🚨 [전역 에러 감지] 파일: ${event.filename} | 라인: ${event.lineno} | 내용: ${event.message}`);
        });

        document.addEventListener('DOMContentLoaded', () => {
            console.log('🔍 [DOM 체크] HTML 문서 로딩 완료. 버튼 및 요소 존재 여부 확인 중...');
            
            const checkElements = ['startBtn', 'stopBtn', 'saveBtn', 'current-speed', 'map', 'speed-tab', 'map-tab'];
            checkElements.forEach(id => {
                const el = document.getElementById(id);
                if (!el) {
                    console.warn(`⚠️ [요소 경고] ID가 '${id}'인 HTML 요소를 찾을 수 없습니다!`);
                } else {
                    console.log(`✔️ [요소 확인] ID '${id}' 정상 로드됨`);
                }
            });

            // 탭 전환 로직
            const tabButtons = document.querySelectorAll('.tab-btn');
            tabButtons.forEach(btn => {
                btn.addEventListener('click', () => {
                    try {
                        const targetTab = btn.getAttribute('data-tab');
                        console.log(`🔄 탭 전환 시도: ${targetTab}`);
                        
                        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
                        document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
                        
                        btn.classList.add('active');
                        const targetContent = document.getElementById(targetTab + '-tab');
                        if (targetContent) {
                            targetContent.classList.add('active');
                        } else {
                            console.error(`❌ 탭 콘텐츠 ID '${targetTab}-tab'을 찾을 수 없습니다.`);
                        }

                        if (targetTab === 'map' && window.mapManager && window.mapManager.map) {
                            setTimeout(() => {
                                window.mapManager.map.relayout();
                                console.log('🗺️ 카카오맵 리레이아웃 완료');
                            }, 100);
                        }
                    } catch (err) {
                        console.error('❌ 탭 전환 중 에러 발생:', err);
                    }
                });
            });
        });
    </script>
</body>
</html>
