<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>자전거 GPS 트래커</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#4CAF50">
    
    <!-- 🔐 GitHub Actions에서 자동 주입 (Secrets: KAKAO_MAP_API_KEY) -->
    <script>
        // GitHub Actions 환경변수 주입 포인트
        // workflow에서 sed 또는 envsubst로 아래 값을 교체합니다
        window.__KAKAO_API_KEY__ = '${{ secrets.KAKAO_MAP_API_KEY }}';
    </script>
</head>
<body>
    <div class="container">
        <header class="header">
            <h1>🚴 자전거 GPS 트래커</h1>
            <p class="subtitle">1단계: 기본 지도 + 위치 읽기</p>
        </header>

        <div class="status-box">
            <p id="status">준비 중...</p>
        </div>

        <div class="info-box">
            <div class="info-item">
                <label>위도</label>
                <p id="latitude">-</p>
            </div>
            <div class="info-item">
                <label>경도</label>
                <p id="longitude">-</p>
            </div>
            <div class="info-item">
                <label>정확도</label>
                <p id="accuracy">-</p>
            </div>
        </div>

        <div id="map" class="map-container"></div>

        <div class="button-group">
            <button id="startBtn" class="btn btn-primary">위치 추적 시작</button>
            <button id="stopBtn" class="btn btn-danger" disabled>추적 중지</button>
        </div>
    </div>

    <!-- ✅ 스크립트 로드 순서 중요! -->
    <!-- 1. 설정 (API 키 포함) -->
    <script src="config.js"></script>
    
    <!-- 2. 카카오 SDK (config.js의 API 키 사용) -->
    <script>
        // config.js 로드 후 SDK 로드
        function loadKakaoSDK() {
            const apiKey = CONFIG.KAKAO_MAP_API_KEY;
            
            if (!apiKey || apiKey === 'YOUR_KAKAO_API_KEY_HERE') {
                console.error('❌ 에러: 카카오 API 키가 설정되지 않았습니다!');
                console.error('로컬: config.js 수정 후 API 키 입력');
                console.error('배포: GitHub Secrets에 KAKAO_MAP_API_KEY 추가');
                return;
            }
            
            const script = document.createElement('script');
            script.src = `//dapi.kakao.com/v2/maps/sdk.js?appkey=${apiKey}&autoload=false`;
            
            script.onload = () => {
                console.log('✅ 카카오 SDK 로드 완료!');
                window.kakaoReady = true;
            };
            
            script.onerror = () => {
                console.error('❌ 카카오 SDK 로드 실패!');
                console.error('API 키가 올바른지 확인하세요.');
            };
            
            document.head.appendChild(script);
        }
        
        // 약간의 지연 후 SDK 로드 (config.js 완전 로드 보장)
        setTimeout(loadKakaoSDK, 100);
    </script>

    <!-- 3. GPS 코드 -->
    <script src="gps.js"></script>

    <!-- 4. 지도 매니저 -->
    <script src="map.js"></script>

    <!-- 5. 메인 앱 (맨 마지막) -->
    <script src="app.js"></script>
</body>
</html>
