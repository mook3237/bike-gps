<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>자전거 GPS 트래커</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" data-icon="bikeicon">
    <meta name="theme-color" content="#121212">
    <meta name="description" content="실시간 자전거 속도 기록 및 경로 추적 웹앱">
</head>
<body>
    <div class="container">
        <!-- 1️⃣ 속도계 화면 탭 -->
        <div class="tab-content active" id="speed-tab">
            <div class="main-stats" id="main-stats-long-press">
                <div class="top-dashboard-bar">
                    <div id="elapsed-time" class="top-time-display">00:00:00</div>
                    <div class="mini-btn-group" style="display: flex; gap: 8px;">
                        <button id="startBtn" class="btn btn-primary" style="padding: 8px 14px; min-height: 36px; border-radius: 50%;">▶</button>
                        <button id="stopBtn" class="btn btn-danger" style="padding: 8px 14px; min-height: 36px; border-radius: 50%;" disabled>⏹</button>
                    </div>
                </div>

                <div class="speedometer-card">
                    <div class="stat-item">
                        <label>현재 속도</label>
                        <p id="current-speed" class="big-text">0.0</p>
                        <p class="speed-unit">km/h</p>
                    </div>
                    <div class="stat-item" style="margin-top: 5px;">
                        <p id="current-distance" class="sub-speedometer-stat">0.00<span>km</span></p>
                    </div>
                </div>
            </div>

            <div class="button-group">
                <button id="saveBtn" class="btn btn-success btn-large" disabled>🔴 기록 저장하기</button>
            </div>

            <div class="info-grid">
                <div class="info-item">
                    <label>평균 속도</label>
                    <p id="avg-speed">0.0 <span style="font-size: 12px; color: var(--text-light);">km/h</span></p>
                </div>
                <div class="info-item">
                    <label>최고 속도</label>
                    <p id="max-speed">0.0 <span style="font-size: 12px; color: var(--text-light);">km/h</span></p>
                </div>
                <div class="info-item">
                    <label>목표 설정 속도</label>
                    <input type="number" id="target-speed" class="input-field" placeholder="목표 km/h" min="0" step="1">
                </div>
                <div class="info-item">
                    <label>남은 거리</label>
                    <p id="remaining-distance">0.00 <span style="font-size: 12px; color: var(--text-light);">km</span></p>
                </div>
            </div>

            <div class="gps-info">
                <div class="info-item">
                    <label>위도</label>
                    <p id="latitude">-</p>
                </div>
                <div class="info-item">
                    <label>경도</label>
                    <p id="longitude">-</p>
                </div>
                <div class="info-item">
                    <label>정확도 / 상태</label>
                    <p id="accuracy">-</p>
                </div>
            </div>
            <div style="text-align: center; font-size: 12px; color: var(--text-light); margin-bottom: 10px;" id="gps-status">준비 중...</div>
        </div>

        <!-- 2️⃣ 지도 화면 탭 -->
        <div class="tab-content" id="map-tab">
            <div class="nav-control-panel" id="nav-control-panel">
                <div class="nav-toggle-group">
                    <button class="nav-toggle-btn active" data-mode="single">편도</button>
                    <button class="nav-toggle-btn" data-mode="round">왕복</button>
                </div>
                <div class="nav-input-group">
                    <input type="text" id="destination-input" class="nav-input" placeholder="목적지 입력 또는 지도 클릭">
                    <button id="clear-nav-btn" class="nav-btn-clear">✕</button>
                </div>
                <div class="nav-info-panel">
                    <div class="nav-info-item">
                        <span class="nav-label">거리</span>
                        <span id="nav-distance" class="nav-value">-</span>
                    </div>
                    <div class="nav-info-item">
                        <span class="nav-label">예상 시간</span>
                        <span id="nav-time" class="nav-value">-</span>
                    </div>
                </div>
            </div>
            
            <div id="map" class="map-container"></div>
        </div>

        <div class="tabs">
            <button class="tab-btn active" data-tab="speed">
                <span>⏱️</span>
                <span>속도계</span>
            </button>
            <button class="tab-btn" data-tab="map">
                <span>🗺️</span>
                <span>지도</span>
            </button>
        </div>
    </div>

    <!-- ✅ 1. 설정 로드 -->
    <script>
        window.__KAKAO_API_KEY__ = '${{ secrets.KAKAO_MAP_API_KEY }}';
    </script>
    <script src="config.js"></script>

    <!-- ✅ 2. 카카오맵 SDK 동적 로드 (콜백 방식) -->
    <script>
        console.log('🚀 카카오 SDK 로드 시작...');
        
        function loadScriptsAfterKakao() {
            console.log('🔌 나머지 스크립트 로드 시작...');
            
            const scripts = ['gps.js', 'map.js', 'navigation.js', 'app.js'];
            let loaded = 0;
            
            scripts.forEach(src => {
                const script = document.createElement('script');
                script.src = src;
                script.onload = () => {
                    loaded++;
                    console.log(`✅ ${src} 로드 완료 (${loaded}/${scripts.length})`);
                    
                    if (loaded === scripts.length) {
                        console.log('🎉 모든 스크립트 로드 완료!');
                    }
                };
                script.onerror = () => {
                    console.error(`❌ ${src} 로드 실패!`);
                };
                document.body.appendChild(script);
            });
        }

        // 카카오 SDK 로드
        if (CONFIG && CONFIG.KAKAO_MAP_API_KEY && !CONFIG.KAKAO_MAP_API_KEY.includes('secrets')) {
            const kakaoScript = document.createElement('script');
            kakaoScript.src = `//dapi.kakao.com/v2/maps/sdk.js?appkey=${CONFIG.KAKAO_MAP_API_KEY}&autoload=false`;
            
            kakaoScript.onload = () => {
                console.log('✅ 카카오 SDK 로드됨');
                kakao.maps.load(() => {
                    console.log('✅ kakao.maps 초기화됨');
                    loadScriptsAfterKakao();
                });
            };
            
            kakaoScript.onerror = () => {
                console.error('❌ 카카오 SDK 로드 실패');
                loadScriptsAfterKakao(); // API 키 없어도 일단 진행
            };
            
            document.head.appendChild(kakaoScript);
        } else {
            console.warn('⚠️ API 키 없음 (깃허브 환경 변수 대기 중)');
            setTimeout(loadScriptsAfterKakao, 1000);
        }
    </script>

    <!-- ✅ 3. 전체 시스템 진단 -->
    <script>
        window.addEventListener('error', function(event) {
            console.error(`🚨 [에러] ${event.filename}:${event.lineno} - ${event.message}`);
        });

        window.addEventListener('load', () => {
            setTimeout(() => {
                console.log('🔍 [최종 체크]');
                const checks = [
                    { id: 'startBtn', name: '시작 버튼' },
                    { id: 'stopBtn', name: '중지 버튼' },
                    { id: 'saveBtn', name: '저장 버튼' },
                    { id: 'map', name: '지도' }
                ];
                
                checks.forEach(check => {
                    const el = document.getElementById(check.id);
                    if (el) {
                        console.log(`✅ ${check.name} 발견`);
                    } else {
                        console.error(`❌ ${check.name} 없음!`);
                    }
                });
                
                if (typeof gpsTracker !== 'undefined') {
                    console.log('✅ gpsTracker 로드됨');
                } else {
                    console.error('❌ gpsTracker 없음!');
                }
                
                if (typeof mapManager !== 'undefined') {
                    console.log('✅ mapManager 로드됨');
                } else {
                    console.error('❌ mapManager 없음!');
                }
            }, 2000);
        });
    </script>
</body>
</html>
