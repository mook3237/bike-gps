<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>자전거 GPS 트래커</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#4CAF50">
</head>
<body>
    <div class="container">
        <header class="header">
            <h1>🚴 자전거 GPS 트래커</h1>
            <p class="subtitle">1단계: 기본 지도 + 위치 읽기</p>
        </header>

        <div class="status-box">
            <p id="status">준비 중...</p>
        </div>

        <div class="info-box">
            <div class="info-item">
                <label>위도</label>
                <p id="latitude">-</p>
            </div>
            <div class="info-item">
                <label>경도</label>
                <p id="longitude">-</p>
            </div>
            <div class="info-item">
                <label>정확도</label>
                <p id="accuracy">-</p>
            </div>
        </div>

        <div id="map" class="map-container"></div>

        <div class="button-group">
            <button id="startBtn" class="btn btn-primary">위치 추적 시작</button>
            <button id="stopBtn" class="btn btn-danger" disabled>추적 중지</button>
        </div>
    </div>

    <!-- ✅ 스크립트 로드 순서 (동적 생성 NO, 직접 로드) -->
    <!-- 1. 설정 -->
    <script src="config.js"></script>
    
    <!-- 2. 카카오 SDK (HTML 직접, autoload=false 필수!) -->
    <script src="//dapi.kakao.com/v2/maps/sdk.js?appkey=YOUR_KAKAO_API_KEY_HERE&autoload=false"></script>
    
    <!-- 3. GPS -->
    <script src="gps.js"></script>
    
    <!-- 4. 지도 -->
    <script src="map.js"></script>
    
    <!-- 5. 메인 앱 (모든 초기화는 여기서) -->
    <script src="app.js"></script>
</body>
</html>
