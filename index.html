<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>자전거 GPS 트래커</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="favicon.svg">
    <meta name="theme-color" content="#121212">
    <meta name="description" content="실시간 자전거 속도 기록 및 경로 추적 웹앱">
    
    <script>
        window.__KAKAO_API_KEY__ = '${{ secrets.KAKAO_MAP_API_KEY }}';
    </script>
</head>
<body>
    <div class="container">
        <!-- 1️⃣ 속도계 화면 탭 -->
        <div class="tab-content active" id="speed-tab">
            <!-- 상단 대시보드 (시간 및 메인 긴 누름 영역) -->
            <div class="main-stats" id="main-stats-long-press">
                <div class="top-dashboard-bar">
                    <div id="elapsed-time" class="top-time-display">00:00:00</div>
                    <div class="mini-btn-group" style="display: flex; gap: 8px;">
                        <button id="startBtn" class="btn btn-primary" style="padding: 8px 14px; min-height: 36px; border-radius: 50%;">▶</button>
                        <button id="stopBtn" class="btn btn-danger" style="padding: 8px 14px; min-height: 36px; border-radius: 50%;" disabled>⏹</button>
                    </div>
                </div>

                <!-- 속도계 원형 디자인 카드 -->
                <div class="speedometer-card">
                    <div class="stat-item">
                        <label>현재 속도</label>
                        <p id="current-speed" class="big-text">0.0</p>
                        <p class="speed-unit">km/h</p>
                    </div>
                    <div class="stat-item" style="margin-top: 5px;">
                        <p id="current-distance" class="sub-speedometer-stat">0.00<span>km</span></p>
                    </div>
                </div>
            </div>

            <!-- 기록 저장 버튼 -->
            <div class="button-group">
                <button id="saveBtn" class="btn btn-success btn-large" disabled>🔴 기록 저장하기</button>
            </div>

            <!-- 상세 정보 그리드 -->
            <div class="info-grid">
                <div class="info-item">
                    <label>평균 속도</label>
                    <p id="avg-speed">0.0 <span style="font-size: 12px; color: var(--text-light);">km/h</span></p>
                </div>
                <div class="info-item">
                    <label>최고 속도</label>
                    <p id="max-speed">0.0 <span style="font-size: 12px; color: var(--text-light);">km/h</span></p>
                </div>
                <div class="info-item">
                    <label>목표 설정 속도</label>
                    <input type="number" id="target-speed" class="input-field" placeholder="목표 km/h" min="0" step="1">
                </div>
                <div class="info-item">
                    <label>남은 거리</label>
                    <p id="remaining-distance">0.00 <span style="font-size: 12px; color: var(--text-light);">km</span></p>
                </div>
            </div>

            <!-- GPS 상세 정보 -->
            <div class="gps-info">
                <div class="info-item">
                    <label>위도</label>
                    <p id="latitude">-</p>
                </div>
                <div class="info-item">
                    <label>경도</label>
                    <p id="longitude">-</p>
                </div>
                <div class="info-item">
                    <label>정확도 / 상태</label>
                    <p id="accuracy">-</p>
                </div>
            </div>
            <div style="text-align: center; font-size: 12px; color: var(--text-light); margin-bottom: 10px;" id="gps-status">준비 중...</div>
        </div>

        <!-- 2️⃣ 지도 화면 탭 (완전 분리된 전체 화면) -->
        <div class="tab-content" id="map-tab">
            <div id="map" class="map-container"></div>
        </div>

        <!-- 하단 고정 탭 네비게이션 -->
        <div class="tabs">
            <button class="tab-btn active" data-tab="speed">
                <span>⏱️</span>
                <span>속도계</span>
            </button>
            <button class="tab-btn" data-tab="map">
                <span>🗺️</span>
                <span>지도</span>
            </button>
        </div>
    </div>

    <!-- 설정 메뉴 모달 -->
    <div class="settings-menu" id="settings-menu">
        <div class="settings-title">메인 정보 선택</div>
        <div class="settings-grid">
            <button class="settings-btn" data-metric="time">시간</button>
            <button class="settings-btn" data-metric="speed">현재 속도</button>
            <button class="settings-btn" data-metric="avg-speed">평균 속도</button>
            <button class="settings-btn" data-metric="max-speed">최고 속도</button>
            <button class="settings-btn" data-metric="distance">거리</button>
            <button class="settings-btn" data-metric="altitude">고도</button>
        </div>
    </div>

    <!-- 스크립트 로드 영역 (원래의 안전한 비동기 로드 구조 복구) -->
    <script src="config.js"></script>
    <script src="gps.js"></script>
    <script>
        const mapScript = document.createElement('script');
        mapScript.src = 'map.js';
        const appScript = document.createElement('script');
        appScript.src = 'app.js';

        function initKakaoSDK() {
            // config.js에 키가 없거나 __KAKAO_API_KEY__를 직접 쓸 경우 대비한 안전 처리
            const apiKey = (typeof CONFIG !== 'undefined' && CONFIG.KAKAO_MAP_API_KEY) ? CONFIG.KAKAO_MAP_API_KEY : window.__KAKAO_API_KEY__;
            
            const kakaoScript = document.createElement('script');
            kakaoScript.src = `//dapi.kakao.com/v2/maps/sdk.js?appkey=${apiKey}&autoload=false`;
            
            kakaoScript.onload = () => {
                kakao.maps.load(() => {
                    document.body.appendChild(mapScript);
                    mapScript.onload = () => {
                        document.body.appendChild(appScript);
                    };
                });
            };
            document.head.appendChild(kakaoScript);
        }

        // DOM이 로드된 후 SDK 초기화 실행
        document.addEventListener('DOMContentLoaded', () => {
            initKakaoSDK();

            // 하단 탭 전환 이벤트 리스너 안전하게 장착
            const tabButtons = document.querySelectorAll('.tab-btn');
            tabButtons.forEach(btn => {
                btn.addEventListener('click', () => {
                    const targetTab = btn.getAttribute('data-tab');
                    
                    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
                    document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
                    
                    btn.classList.add('active');
                    const targetContent = document.getElementById(targetTab + '-tab');
                    if (targetContent) targetContent.classList.add('active');

                    // 지도 탭으로 전환 시 카카오맵 크기 재조정
                    if (targetTab === 'map' && window.mapManager && window.mapManager.map) {
                        setTimeout(() => {
                            window.mapManager.map.relayout();
                        }, 100);
                    }
                });
            });
        });
    </script>
</body>
</html>
